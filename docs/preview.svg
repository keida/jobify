<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Excel Analytics Studio preview</title>
  <desc id="desc">Static preview of the runnable Excel analytics dashboard served from this repository.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ccfbf1" />
      <stop offset="0.45" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2ff" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.13" />
    </filter>
    <style>
      .eyebrow { font: 800 13px Inter, Arial, sans-serif; letter-spacing: 2.2px; fill: #0f766e; text-transform: uppercase; }
      .hero-title { font: 900 58px Inter, Arial, sans-serif; fill: #0f172a; }
      .hero-copy { font: 500 20px Inter, Arial, sans-serif; fill: #334155; }
      .section-title { font: 900 26px Inter, Arial, sans-serif; fill: #0f172a; }
      .card-title { font: 800 17px Inter, Arial, sans-serif; fill: #0f172a; }
      .muted { font: 500 14px Inter, Arial, sans-serif; fill: #64748b; }
      .stat-label { font: 800 13px Inter, Arial, sans-serif; letter-spacing: 1.3px; fill: #64748b; }
      .stat-value { font: 900 40px Inter, Arial, sans-serif; fill: #0f172a; }
      .badge { font: 800 12px Inter, Arial, sans-serif; }
      .field { font: 700 15px Inter, Arial, sans-serif; fill: #334155; }
      .step { font: 900 16px Inter, Arial, sans-serif; fill: #134e4a; }
    </style>
  </defs>
  <rect width="1200" height="820" fill="url(#pageBg)" />

  <g filter="url(#softShadow)">
    <rect x="70" y="48" width="1060" height="202" rx="28" fill="#ffffff" fill-opacity="0.94" stroke="#e2e8f0" />
    <text x="112" y="100" class="eyebrow">Step-by-step data analysis workflow</text>
    <text x="112" y="166" class="hero-title">Excel Analytics Studio</text>
    <text x="112" y="210" class="hero-copy">Upload multiple Excel/CSV files, clean rows, and generate summaries</text>
    <text x="112" y="238" class="hero-copy">based on the analysis requirement you describe.</text>
    <rect x="874" y="116" width="126" height="46" rx="23" fill="#0f172a" />
    <text x="937" y="145" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#ffffff">Upload files</text>
    <rect x="1012" y="116" width="108" height="46" rx="23" fill="#0f766e" />
    <text x="1066" y="145" text-anchor="middle" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#ffffff">Analyze</text>
  </g>

  <g filter="url(#softShadow)"><rect x="70" y="278" width="194" height="92" rx="20" fill="#ffffff" stroke="#e2e8f0" /><circle cx="104" cy="310" r="17" fill="#ccfbf1" /><text x="104" y="316" text-anchor="middle" class="badge" fill="#134e4a">01</text><text x="92" y="348" class="step">数据收集</text></g><g filter="url(#softShadow)"><rect x="284" y="278" width="194" height="92" rx="20" fill="#ffffff" stroke="#e2e8f0" /><circle cx="318" cy="310" r="17" fill="#ccfbf1" /><text x="318" y="316" text-anchor="middle" class="badge" fill="#134e4a">02</text><text x="306" y="348" class="step">数据存储</text></g><g filter="url(#softShadow)"><rect x="498" y="278" width="194" height="92" rx="20" fill="#ffffff" stroke="#e2e8f0" /><circle cx="532" cy="310" r="17" fill="#ccfbf1" /><text x="532" y="316" text-anchor="middle" class="badge" fill="#134e4a">03</text><text x="520" y="348" class="step">数据处理</text></g><g filter="url(#softShadow)"><rect x="712" y="278" width="194" height="92" rx="20" fill="#ffffff" stroke="#e2e8f0" /><circle cx="746" cy="310" r="17" fill="#ccfbf1" /><text x="746" y="316" text-anchor="middle" class="badge" fill="#134e4a">04</text><text x="734" y="348" class="step">数据清洗</text></g><g filter="url(#softShadow)"><rect x="926" y="278" width="194" height="92" rx="20" fill="#ffffff" stroke="#e2e8f0" /><circle cx="960" cy="310" r="17" fill="#ccfbf1" /><text x="960" y="316" text-anchor="middle" class="badge" fill="#134e4a">05</text><text x="948" y="348" class="step">数据分析</text></g>

  <g filter="url(#softShadow)"><rect x="70" y="400" width="245" height="116" rx="22" fill="#ffffff" stroke="#e2e8f0" /><rect x="70" y="400" width="245" height="7" rx="3" fill="#0f766e" /><text x="94" y="442" class="stat-label">FILES</text><text x="94" y="486" class="stat-value">3</text></g><g filter="url(#softShadow)"><rect x="342" y="400" width="245" height="116" rx="22" fill="#ffffff" stroke="#e2e8f0" /><rect x="342" y="400" width="245" height="7" rx="3" fill="#4f46e5" /><text x="366" y="442" class="stat-label">ROWS</text><text x="366" y="486" class="stat-value">1,248</text></g><g filter="url(#softShadow)"><rect x="614" y="400" width="245" height="116" rx="22" fill="#ffffff" stroke="#e2e8f0" /><rect x="614" y="400" width="245" height="7" rx="3" fill="#d97706" /><text x="638" y="442" class="stat-label">COLUMNS</text><text x="638" y="486" class="stat-value">18</text></g><g filter="url(#softShadow)"><rect x="886" y="400" width="245" height="116" rx="22" fill="#ffffff" stroke="#e2e8f0" /><rect x="886" y="400" width="245" height="7" rx="3" fill="#059669" /><text x="910" y="442" class="stat-label">QUALITY</text><text x="910" y="486" class="stat-value">94%</text></g>

  <g filter="url(#softShadow)">
    <rect x="70" y="548" width="370" height="204" rx="24" fill="#ffffff" stroke="#e2e8f0" />
    <text x="100" y="594" class="eyebrow">Data collection</text>
    <text x="100" y="632" class="section-title">Upload files</text>
    <rect x="100" y="656" width="300" height="58" rx="16" fill="#f0fdfa" stroke="#99f6e4" stroke-dasharray="8 6" />
    <text x="250" y="691" text-anchor="middle" class="field">Drop .xlsx / .csv files here</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="460" y="548" width="670" height="204" rx="24" fill="#ffffff" stroke="#e2e8f0" />
    <text x="492" y="594" class="eyebrow">Data analysis</text>
    <text x="492" y="632" class="section-title">Generated dashboard</text>
    <rect x="810" y="576" width="280" height="42" rx="12" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="830" y="603" class="muted">Search columns, values...</text>
  </g>
  
      <g filter="url(#softShadow)">
        <rect x="482" y="566" width="608" height="54" rx="16" fill="#ffffff" stroke="#e2e8f0" />
        <text x="506" y="590" class="card-title">Revenue</text>
        <text x="506" y="610" class="muted">Sum 526,500 · Avg 105,300 · Missing 1</text>
        <rect x="984" y="579" width="82" height="28" rx="14" fill="#dbeafe" />
        <text x="1025" y="598" text-anchor="middle" class="badge" fill="#1d4ed8">numeric</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="482" y="636" width="608" height="54" rx="16" fill="#ffffff" stroke="#e2e8f0" />
        <text x="506" y="660" class="card-title">Region</text>
        <text x="506" y="680" class="muted">Top values: NSW (3), VIC (2), QLD (1)</text>
        <rect x="984" y="649" width="82" height="28" rx="14" fill="#fef3c7" />
        <text x="1025" y="668" text-anchor="middle" class="badge" fill="#a16207">text</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="482" y="706" width="608" height="54" rx="16" fill="#ffffff" stroke="#e2e8f0" />
        <text x="506" y="730" class="card-title">Product</text>
        <text x="506" y="750" class="muted">Top values: Software (3), Service (2)</text>
        <rect x="984" y="719" width="82" height="28" rx="14" fill="#fef3c7" />
        <text x="1025" y="738" text-anchor="middle" class="badge" fill="#a16207">text</text>
      </g>
</svg>
